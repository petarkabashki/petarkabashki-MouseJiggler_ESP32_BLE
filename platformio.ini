; ---------------------------------------------------------------------------
; ESP-IDF build: no Arduino, no Arduino libraries. Same Forth core, different
; platform backend (src/port_idf.c). Kept alongside the Arduino envs until it
; is proven on hardware.
; ---------------------------------------------------------------------------
[env:esp32-c3-idf]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_huge.csv
board_build.filesystem = littlefs
