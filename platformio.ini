; Shared by every environment: regenerate data/symbols.txt after each link, so
; the Forth FFI's `sym` word has addresses that match the image just built.
[env]
extra_scripts = post:tools/gen_symbols.py


[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; WiFi + BLE + Forth no longer fit the default 1.3 MB app slot
board_build.partitions = partitions_huge.csv
; huge_app.csv leaves an 896 KB data partition; LittleFS takes it over, and
; `pio run -t uploadfs` pushes the contents of data/ into it.
board_build.filesystem = littlefs
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
; port_idf.c and main_idf.cpp are the ESP-IDF backend; they have no place here.
build_src_filter = +<*> -<port_idf.c> -<main_idf.cpp>
; ESP32-BLE-Mouse is vendored in lib/ — extended into a combo mouse+keyboard HID


; ESP32-C3 0.42" OLED "egg" board (SDA=5, SCL=6, LED=8, BOOT button=9)
[env:esp32-c3-042oled]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; WiFi + BLE + Forth no longer fit the default 1.3 MB app slot
board_build.partitions = partitions_huge.csv
; huge_app.csv leaves an 896 KB data partition; LittleFS takes it over, and
; `pio run -t uploadfs` pushes the contents of data/ into it.
board_build.filesystem = littlefs
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D HAS_OLED
build_src_filter = +<*> -<port_idf.c> -<main_idf.cpp>
lib_deps =
    olikraus/U8g2@^2.36.5


